<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おうち動画保存</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#182e3b;background:#edf3f5}body{max-width:700px;margin:auto;padding:32px 20px}small{color:#486878}h1{font-size:29px;letter-spacing:-1px}section,article{background:white;padding:24px;border-radius:20px;margin:20px 0;box-shadow:0 6px 25px #24485a0a}label{display:block;margin:15px 0 8px;font-weight:600}input,select,button,a.save{box-sizing:border-box;font:inherit;border-radius:10px;padding:14px;width:100%}input,select{border:1px solid #b8cbd4;background:#fff}button,a.save{background:#12687b;color:white;border:0;display:block;text-align:center;text-decoration:none;cursor:pointer;margin-top:16px}button:disabled{opacity:.5}article h3{font-size:17px;overflow-wrap:anywhere}article p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:#4d6673}.badge{font-size:12px;background:#e1f2ef;padding:6px 10px;border-radius:20px}#message{color:#a13b21}footer{font-size:12px;line-height:1.7;color:#526874}</style>
<small>MAC MINI → IPHONE · HOME WI-FI</small><h1>おうち動画保存</h1><p>URLを貼って、Macにおまかせ。</p><section><form id="form"><label for="url">YouTubeの動画URL</label><input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=…"><label for="height">画質の上限</label><select id="height"><option value="360">360p · 容量を節約</option><option value="720" selected>720p · 標準</option><option value="1080">1080p · 高画質</option></select><button id="submit">Macで取得を開始</button><p id="message" role="status"></p></form></section><h2>処理した動画</h2><div id="jobs" aria-live="polite">読み込み中…</div><footer>保存先はiPhoneの「ファイル」です。Macにもコピーが残ります。取得・保存する権限のある動画に使用してください。非公開・有料・ログイン必須の動画には対応しません。</footer>
<script>
const key=new URLSearchParams(location.search).get('key')||'';
const jobs=document.querySelector('#jobs'),message=document.querySelector('#message');
async function refresh(){try{const r=await fetch('/api/jobs',{headers:{'X-Access-Key':key}});if(!r.ok)throw Error('接続URLを確認してください');const data=await r.json();jobs.replaceChildren();if(!data.length)jobs.textContent='まだ動画はありません。';for(const j of data){const a=document.createElement('article');const badge=document.createElement('span');badge.className='badge';badge.textContent=j.status;const title=document.createElement('h3');title.textContent=j.title;const p=document.createElement('p');p.textContent=j.progress;a.append(badge,title,p);if(j.status==='完了'){const link=document.createElement('a');link.className='save';link.textContent=`MP4を保存 · ${(j.size/1048576).toFixed(1)} MB`;link.href='/download/'+j.id+'?key='+encodeURIComponent(key);a.append(link);}jobs.append(a)}}catch(e){jobs.textContent='Macに接続できません。起動状態と接続URLをご確認ください。'}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#submit');b.disabled=true;message.textContent='';try{const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json','X-Access-Key':key},body:JSON.stringify({url:document.querySelector('#url').value,height:Number(document.querySelector('#height').value)})});const data=await r.json();if(!r.ok)throw Error(data.error);message.textContent='登録しました。ページを閉じてもMacの処理は続きます。';document.querySelector('#url').value='';await refresh()}catch(e){message.textContent=e.message}finally{b.disabled=false}};refresh();setInterval(refresh,2500);
</script></html>
