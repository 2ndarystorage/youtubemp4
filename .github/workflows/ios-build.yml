name: iOS simulator runtime tests
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone iPhone app
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if "iPhone" in x["name"]))')
          xcodebuild -project ios/YouTubeMP4/YouTubeMP4.xcodeproj -scheme YouTubeMP4 -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath /tmp/YouTubeMP4-tests -derivedDataPath /tmp/YouTubeMP4-build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test | tee /tmp/YouTubeMP4-build.log

  current-sdk:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build with Xcode 26.3 and inspect current SDK warnings
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project ios/YouTubeMP4/YouTubeMP4.xcodeproj -scheme YouTubeMP4 -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/YouTubeMP4-current-sdk CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build | tee /tmp/YouTubeMP4-current-sdk.log
